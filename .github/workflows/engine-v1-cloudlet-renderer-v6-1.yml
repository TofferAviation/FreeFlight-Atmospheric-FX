name: Build Renderer Foundation v6.1 Native 3D Cloudlets

on:
  workflow_dispatch:
  push:
    branches:
      - agent/levelup-particle-renderer-v5
    paths:
      - "src/ContrailCloudletRenderer.h"
      - "tools/generate_v6_1_cloudlet_assets.py"
      - "tools/patch_v6_1_cloudlet_renderer.py"
      - ".github/workflows/engine-v1-cloudlet-renderer-v6-1.yml"
  pull_request:
    branches:
      - engine/v1
    paths:
      - "src/ContrailCloudletRenderer.h"
      - "tools/generate_v6_1_cloudlet_assets.py"
      - "tools/patch_v6_1_cloudlet_renderer.py"
      - ".github/workflows/engine-v1-cloudlet-renderer-v6-1.yml"

permissions:
  contents: read

concurrency:
  group: ffatmo-cloudlets-v61-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out renderer branch
        uses: actions/checkout@v4
        with:
          ref: agent/levelup-particle-renderer-v5

      - name: Apply stable wake baseline and v6.1 renderer
        shell: pwsh
        run: |
          python tools/fix_v5_5_regex_literals.py
          python tools/patch_v5_4_1_runtime.py
          python tools/patch_v5_5_parcel_clusters.py
          python tools/patch_v5_5_1_visibility.py
          python tools/patch_v5_5_2_cruise_visibility.py
          python tools/patch_v5_6_connected_cloud_swirl.py
          python tools/patch_v6_1_cloudlet_renderer.py

          $plugin = Get-Content src/ContrailDebugPlugin.cpp -Raw
          $renderer = Get-Content src/ContrailCloudletRenderer.h -Raw
          if ($plugin -notmatch 'ContrailCloudletRenderer') { throw "v6.1 cloudlet renderer not integrated" }
          if ($plugin -match 'ContrailParticleRenderer worldRenderer_') { throw "particle renderer still owns world rendering" }
          if ($plugin -notmatch '3D CLOUD V6\.1 READY') { throw "v6.1 cloud overlay missing" }
          if ($renderer -notmatch 'XPLMCreateInstance') { throw "native instance path missing" }
          if ($renderer -notmatch 'contrail_cloudlet\.obj') { throw "3-D cloudlet asset path missing" }
          if ($renderer -match 'XPLMRegisterDrawCallback|xplm_Phase_Modern3D|BILLBOARD_MODE|PARTICLE_SYSTEM') { throw "unsupported callback or billboard path leaked into v6.1" }
          if ($renderer -notmatch 'kInstancesPerAsset = 768') { throw "v6.1 cloudlet pool size missing" }

      - name: Generate and validate 3-D cloudlet assets
        shell: pwsh
        run: |
          python tools/generate_v6_1_cloudlet_assets.py generated-v61-assets
          $obj = Get-Content generated-v61-assets/contrail_cloudlet.obj -Raw
          if ($obj -match 'PARTICLE_SYSTEM|EMITTER|BILLBOARD') { throw "particle primitives are forbidden in v6.1" }
          if ($obj -notmatch 'ATTR_blend') { throw "cloudlet translucency missing" }
          if ($obj -notmatch 'GLOBAL_no_shadow') { throw "cloudlet no-shadow state missing" }
          if ($obj -notmatch 'TRIS 0') { throw "closed 3-D triangle mesh missing" }
          @'
          from pathlib import Path
          import re, struct
          obj = Path("generated-v61-assets/contrail_cloudlet.obj").read_text()
          vt = sum(1 for line in obj.splitlines() if line.startswith("VT "))
          tris = re.search(r"TRIS 0 (\d+)", obj)
          if vt < 500: raise RuntimeError(f"Expected dense 3-D cloudlet mesh, got {vt} vertices")
          if not tris or int(tris.group(1)) < 2500: raise RuntimeError("Cloudlet triangle index count too low")
          data = Path("generated-v61-assets/contrail_cloudlet.png").read_bytes()
          w,h = struct.unpack(">II", data[16:24])
          if (w,h) != (256,256): raise RuntimeError(f"Unexpected cloudlet texture size {(w,h)}")
          '@ | python -

      - name: Fetch X-Plane Plugin SDK 4.3.0
        id: sdk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          $archive = Join-Path $pwd "third_party/XPSDK430.zip"
          $destination = Join-Path $pwd "third_party/xplane-sdk"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              if (Test-Path $archive) { Remove-Item $archive -Force }
              Invoke-WebRequest -Uri "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip" -OutFile $archive -Headers @{ "User-Agent" = "FFAtmo-GitHub-Actions" }
              if ((Get-Item $archive).Length -lt 1000000) { throw "SDK archive is unexpectedly small" }
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (8 * $attempt)
            }
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $header = Get-ChildItem $destination -Recurse -Filter "XPLMPlugin.h" | Where-Object { $_.FullName.Replace('\', '/') -like '*/CHeaders/XPLM/XPLMPlugin.h' } | Select-Object -First 1
          if (-not $header) { throw "XPLMPlugin.h was not found" }
          $root = Split-Path (Split-Path (Split-Path $header.FullName -Parent) -Parent) -Parent
          "path=$root" >> $env:GITHUB_OUTPUT

      - name: Compile plugin and deterministic physics tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          cmake -S . -B build-v61 -A x64 -DXPLANE_SDK="${{ steps.sdk.outputs.path }}" -DFFATMO_BUILD_PLUGIN=OFF -DFFATMO_BUILD_COMPANION=OFF -DFFATMO_BUILD_IMGUI_PANEL=OFF -DFFATMO_BUILD_GEOMETRY_DEBUG=OFF -DFFATMO_BUILD_RECORDER_DEBUG=OFF -DFFATMO_BUILD_CONTRAIL_DEBUG=ON -DFFATMO_BUILD_REPLAY_RUNNER=OFF -DFFATMO_BUILD_TESTS=ON -DFFATMO_GIT_REVISION="${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake --build build-v61 --config Release --target FFAtmoContrailDebug ffatmo_core_tests ffatmo_acf_tests ffatmo_replay_tests ffatmo_replay_runner_tests ffatmo_contrail_tests ffatmo_live_contrail_debug_tests ffatmo_contrail_render_planner_tests *> build-logs/build.txt
          if ($LASTEXITCODE -ne 0) { Get-Content build-logs/build.txt; exit $LASTEXITCODE }
          & ctest --test-dir build-v61 -C Release --output-on-failure *> build-logs/tests.txt
          if ($LASTEXITCODE -ne 0) { Get-Content build-logs/tests.txt; exit $LASTEXITCODE }
          if (-not (Test-Path package/FFAtmoContrailDebug/64/win.xpl)) { throw "v6.1 plugin was not produced" }

      - name: Assemble v6.1 test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/64 | Out-Null
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/assets | Out-Null
          Copy-Item package/FFAtmoContrailDebug/64/win.xpl artifact/FFAtmoContrailDebug/64/win.xpl -Force
          Copy-Item generated-v61-assets/* artifact/FFAtmoContrailDebug/assets/ -Force
          @'
          FFAtmo Renderer Foundation v6.1 - Native 3-D Cloudlet Volume Field

          This build retires the non-dispatched Modern3D callback used by v6.0/v6.0.1.
          It uses supported XPLMInstance rendering of closed irregular 3-D cloudlet
          geometry. There are no particle billboards, axial billboards, ribbons or
          camera-facing planes.

          v6.1 is a proof of the supported camera-independent 3-D rendering boundary.
          Confirm "3D CLOUD V6.1 READY". Test Forced Dry Preview from rear, side,
          front, above and underneath. The wake should exist in physical 3-D space
          and should not rotate to face the camera.
          '@ | Set-Content artifact/FFAtmoContrailDebug/README_TESTING.txt -Encoding utf8
          "renderer=engine-v1-levelup-b738-v6.1-native-3d-cloudlets" | Set-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8
          "git_revision=${{ github.sha }}" | Add-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmo-v6.1-build-diagnostics
          path: build-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload v6.1 package
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmoContrailDebug-v6.1-win64
          path: artifact/FFAtmoContrailDebug
          if-no-files-found: error
          retention-days: 14
