name: Build Renderer Foundation v6.5 Ice White Vortex Field

on:
  workflow_dispatch:
  push:
    branches:
      - agent/levelup-particle-renderer-v5
    paths:
      - "tools/generate_v6_5_cutout_assets.py"
      - "tools/patch_v6_5_handoff_vortex.py"
      - ".github/workflows/engine-v1-cloudlet-renderer-v6-5.yml"
  pull_request:
    branches:
      - engine/v1
    paths:
      - "tools/generate_v6_5_cutout_assets.py"
      - "tools/patch_v6_5_handoff_vortex.py"
      - ".github/workflows/engine-v1-cloudlet-renderer-v6-5.yml"

permissions:
  contents: read

concurrency:
  group: ffatmo-cloudlets-v65-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out renderer branch
        uses: actions/checkout@v4
        with:
          ref: agent/levelup-particle-renderer-v5

      - name: Apply stable wake baseline through v6.5
        shell: pwsh
        run: |
          python tools/fix_v5_5_regex_literals.py
          python tools/patch_v5_4_1_runtime.py
          python tools/patch_v5_5_parcel_clusters.py
          python tools/patch_v5_5_1_visibility.py
          python tools/patch_v5_5_2_cruise_visibility.py
          python tools/patch_v5_6_connected_cloud_swirl.py
          python tools/patch_v6_1_cloudlet_renderer.py
          python tools/patch_v6_2_filled_cloud_renderer.py
          python tools/patch_v6_3_morphology_onset_v2.py
          python tools/patch_v6_4_head_endpoint_pool.py
          python tools/patch_v6_5_handoff_vortex.py

          $plugin = Get-Content src/ContrailDebugPlugin.cpp -Raw
          $renderer = Get-Content src/ContrailCloudletRendererV62.h -Raw
          $planner = Get-Content src/render/ContrailRenderPlanner.cpp -Raw
          if ($plugin -notmatch '3D CLOUD V6\.5 VORTEX READY') { throw "v6.5 overlay identity missing" }
          if ($plugin -notmatch 'ICE_WHITE_VORTEX_FIELD') { throw "v6.5 report identity missing" }
          if ($plugin -notmatch 'render_material_mode=ALPHA_TEST_CUTOUT') { throw "cutout diagnostic missing" }
          if ($plugin -notmatch 'youngestRenderableLocal') { throw "live streamline bridge missing" }
          if ($plugin -notmatch 'synthetic_head_actual_distance_') { throw "live head distance diagnostics missing" }
          if ($plugin -notmatch 'kHeatBlurHandoffSeconds = 0\.04f') { throw "short live handoff missing" }
          if ($planner -notmatch 'syntheticHeadIt') { throw "explicit synthetic-head endpoint lost" }
          if ($renderer -notmatch 'sample\.ageSeconds >= 3\.0f') { throw "vortex development stage missing" }
          if ($renderer -notmatch 'maximumSwirlRadiusM_') { throw "vortex radius diagnostic missing" }
          if ($renderer -notmatch 'kVisibleCapacity = 1024') { throw "fixed 1024 cloudlet pool lost" }
          if ($renderer -notmatch '48, 164, 164, 164, 164, 144, 144, 32') { throw "v6.4 adaptive pool lost" }
          if ($renderer -cmatch 'xplm_Phase_Modern3D|XPLMRegisterDrawCallback|PARTICLE_SYSTEM|BILLBOARD_MODE|ANIM_billboard') { throw "unsupported renderer path leaked into v6.5" }

      - name: Generate and validate ice-white alpha-test assets
        shell: pwsh
        run: |
          python tools/generate_v6_5_cutout_assets.py generated-v65-assets
          @'
          from pathlib import Path
          import struct, zlib

          root = Path("generated-v65-assets")
          ages = ["near", "young", "mature", "old"]
          variants = ["soft", "dense"]
          extents = {variant: [] for variant in variants}
          occupancy = {}

          def png_rgba(path):
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise RuntimeError(f"Not PNG: {path}")
              w,h = struct.unpack(">II", data[16:24])
              pos = 8
              payload = bytearray()
              while pos < len(data):
                  length = struct.unpack(">I", data[pos:pos+4])[0]
                  kind = data[pos+4:pos+8]
                  if kind == b"IDAT": payload.extend(data[pos+8:pos+8+length])
                  pos += 12 + length
                  if kind == b"IEND": break
              raw = zlib.decompress(bytes(payload))
              stride = w * 4
              rgba=[]
              cursor=0
              for _ in range(h):
                  if raw[cursor] != 0: raise RuntimeError(f"Unexpected PNG filter in {path}")
                  cursor += 1
                  row=raw[cursor:cursor+stride]; cursor += stride
                  rgba.extend(zip(row[0::4], row[1::4], row[2::4], row[3::4]))
              return w,h,rgba

          for age in ages:
              for variant in variants:
                  name=f"{age}_{variant}"
                  obj_path=root/f"contrail_cloudlet_{name}.obj"
                  png_path=root/f"contrail_cloudlet_{name}.png"
                  if not obj_path.exists() or not png_path.exists():
                      raise RuntimeError(f"Missing v6.5 asset {name}")
                  obj=obj_path.read_text()
                  forbidden=("PARTICLE_SYSTEM","EMITTER","BILLBOARD","ANIM_billboard","ATTR_no_cull","ATTR_blend","BLEND_GLASS","TEXTURE_LIT")
                  if any(token in obj for token in forbidden):
                      raise RuntimeError(f"{name}: forbidden translucent/particle state")
                  if "GLOBAL_no_blend 0.500" not in obj:
                      raise RuntimeError(f"{name}: alpha-test state missing")
                  vertices=[]
                  for line in obj.splitlines():
                      if line.startswith("VT "):
                          f=line.split(); vertices.append(tuple(float(v) for v in f[1:4]))
                  if len(vertices) != 342:
                      raise RuntimeError(f"{name}: expected one 342-vertex shell, got {len(vertices)}")
                  z=max(v[2] for v in vertices)-min(v[2] for v in vertices)
                  x=max(v[0] for v in vertices)-min(v[0] for v in vertices)
                  extents[variant].append((z,x))
                  w,h,rgba=png_rgba(png_path)
                  if (w,h)!=(256,256): raise RuntimeError(f"{name}: texture dimensions invalid")
                  alpha={p[3] for p in rgba}
                  if not alpha.issubset({0,255}) or alpha != {0,255}:
                      raise RuntimeError(f"{name}: texture must be binary alpha, got {sorted(alpha)[:8]}")
                  if any((r,g,b)!=(255,255,255) for r,g,b,a in rgba):
                      raise RuntimeError(f"{name}: non-white RGB found")
                  occupancy[name]=sum(1 for p in rgba if p[3]==255)/len(rgba)
                  if not (0.12 <= occupancy[name] <= 0.88):
                      raise RuntimeError(f"{name}: bad cutout occupancy {occupancy[name]}")

          for variant in variants:
              if not all(extents[variant][i][0] < extents[variant][i+1][0] for i in range(3)):
                  raise RuntimeError(f"{variant}: longitudinal growth failed {extents[variant]}")
              if not all(extents[variant][i][1] < extents[variant][i+1][1] for i in range(3)):
                  raise RuntimeError(f"{variant}: width growth failed {extents[variant]}")
          for age in ages:
              if not occupancy[f"{age}_soft"] < occupancy[f"{age}_dense"]:
                  raise RuntimeError(f"{age}: soft/dense cutout ordering failed")
          print("Validated v6.5 extents:", extents)
          print("Validated v6.5 cutout occupancy:", occupancy)
          '@ | python -

      - name: Fetch X-Plane Plugin SDK 4.3.0
        id: sdk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          $archive = Join-Path $pwd "third_party/XPSDK430.zip"
          $destination = Join-Path $pwd "third_party/xplane-sdk"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              if (Test-Path $archive) { Remove-Item $archive -Force }
              Invoke-WebRequest -Uri "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip" -OutFile $archive -Headers @{ "User-Agent" = "FFAtmo-GitHub-Actions" }
              if ((Get-Item $archive).Length -lt 1000000) { throw "SDK archive is unexpectedly small" }
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (8 * $attempt)
            }
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $header = Get-ChildItem $destination -Recurse -Filter "XPLMPlugin.h" | Where-Object { $_.FullName.Replace('\', '/') -like '*/CHeaders/XPLM/XPLMPlugin.h' } | Select-Object -First 1
          if (-not $header) { throw "XPLMPlugin.h was not found" }
          $root = Split-Path (Split-Path (Split-Path $header.FullName -Parent) -Parent) -Parent
          "path=$root" >> $env:GITHUB_OUTPUT

      - name: Compile plugin and deterministic tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          cmake -S . -B build-v65 -A x64 -DXPLANE_SDK="${{ steps.sdk.outputs.path }}" -DFFATMO_BUILD_PLUGIN=OFF -DFFATMO_BUILD_COMPANION=OFF -DFFATMO_BUILD_IMGUI_PANEL=OFF -DFFATMO_BUILD_GEOMETRY_DEBUG=OFF -DFFATMO_BUILD_RECORDER_DEBUG=OFF -DFFATMO_BUILD_CONTRAIL_DEBUG=ON -DFFATMO_BUILD_REPLAY_RUNNER=OFF -DFFATMO_BUILD_TESTS=ON -DFFATMO_GIT_REVISION="${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake --build build-v65 --config Release --target FFAtmoContrailDebug ffatmo_core_tests ffatmo_acf_tests ffatmo_replay_tests ffatmo_replay_runner_tests ffatmo_contrail_tests ffatmo_live_contrail_debug_tests ffatmo_contrail_render_planner_tests *> build-logs/build.txt
          if ($LASTEXITCODE -ne 0) { Get-Content build-logs/build.txt; exit $LASTEXITCODE }
          & ctest --test-dir build-v65 -C Release --output-on-failure *> build-logs/tests.txt
          if ($LASTEXITCODE -ne 0) { Get-Content build-logs/tests.txt; exit $LASTEXITCODE }
          if (-not (Test-Path package/FFAtmoContrailDebug/64/win.xpl)) { throw "v6.5 plugin was not produced" }

      - name: Assemble v6.5 test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/64 | Out-Null
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/assets | Out-Null
          Copy-Item package/FFAtmoContrailDebug/64/win.xpl artifact/FFAtmoContrailDebug/64/win.xpl -Force
          Copy-Item generated-v65-assets/* artifact/FFAtmoContrailDebug/assets/ -Force
          @'
          FFAtmo Renderer Foundation v6.5 - Ice White Cutout + Live Handoff + Vortex Roll-Up

          This is the first deliberate wake-realism phase after the native 3-D physics/render
          foundation proved stable in v6.4.

          v6.5 changes:
          - translucent OBJ blending removed; GLOBAL_no_blend 0.5 alpha testing is used;
          - all visible texture fragments are pure ice-white RGB with binary porous alpha;
          - synthetic head follows exhaust -> youngest renderable wake parcel instead of aircraft-velocity extrapolation;
          - visual onset shortened to roughly 8-14 m while thermodynamic nucleation timing remains unchanged;
          - primary cloud stays on physical wake centreline;
          - companion cloud mass counter-rotates left/right from ~3-30 s with bounded radius and late diffusion;
          - no particle, billboard, Ribbon, Modern3D or custom GPU fallback.

          Confirm "3D CLOUD V6.5 VORTEX READY". Use Forced Dry Preview. Inspect live and paused
          near-field alignment, then allow 30-60 seconds for the developing vortex field.
          '@ | Set-Content artifact/FFAtmoContrailDebug/README_TESTING.txt -Encoding utf8
          "renderer=engine-v1-levelup-b738-v6.5-ice-white-cutout-vortex" | Set-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8
          "git_revision=${{ github.sha }}" | Add-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmo-v6.5-build-diagnostics
          path: build-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload v6.5 package
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmoContrailDebug-v6.5-win64
          path: artifact/FFAtmoContrailDebug
          if-no-files-found: error
          retention-days: 14
