name: Build Engine v1 Contrail Visual Debug

on:
  workflow_dispatch:
  push:
    branches:
      - engine/v1
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "tools/generate_contrail_assets.py"
      - "tests/**"
      - ".github/workflows/engine-v1-contrail-debug.yml"
  pull_request:
    branches:
      - engine/v1
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "tools/generate_contrail_assets.py"
      - "tests/**"
      - ".github/workflows/engine-v1-contrail-debug.yml"

permissions:
  contents: write

concurrency:
  group: ffatmo-engine-v1-contrail-debug-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Check out contrail source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply Renderer v4.8 daylight cloud correction
        shell: pwsh
        run: |
          function Replace-Required([string]$path, [string]$old, [string]$new, [string]$label) {
            $text = Get-Content $path -Raw
            if ($text.Contains($new)) {
              Write-Host "$label already applied"
              return
            }
            if (-not $text.Contains($old)) { throw "$label source text was not found in $path" }
            $text = $text.Replace($old, $new)
            Set-Content $path $text -Encoding utf8 -NoNewline
          }

          $renderer = "src/ContrailWorldRenderer.h"
          Replace-Required $renderer `
            'static constexpr std::size_t kInstancesPerAsset = 192;' `
            'static constexpr std::size_t kInstancesPerAsset = 256;' `
            'larger per-asset instance pools'
          Replace-Required $renderer `
            'static constexpr std::size_t kVisibleCapacity = 1024;' `
            'static constexpr std::size_t kVisibleCapacity = 1536;' `
            'full pooled visible capacity'
          $rendererText = Get-Content $renderer -Raw
          $rendererText = $rendererText.Replace('v4.7', 'v4.8')
          Set-Content $renderer $rendererText -Encoding utf8 -NoNewline

          $plugin = "src/ContrailDebugPlugin.cpp"
          $pluginText = Get-Content $plugin -Raw
          $pluginText = $pluginText.Replace('v4.5', 'v4.8')
          $pluginText = $pluginText.Replace('V4.5', 'V4.8')
          $pluginText = $pluginText.Replace('v4 point 5', 'v4 point 8')
          Set-Content $plugin $pluginText -Encoding utf8 -NoNewline

          $assets = "tools/generate_contrail_assets.py"
          Replace-Required $assets `
            '"""Generate deterministic Renderer Foundation v4.7 lit-alpha composite assets."""' `
            '"""Generate deterministic Renderer Foundation v4.8 daylight-cloud composite assets."""' `
            'asset generator version'
          Replace-Required $assets `
            'END_BORDER_PIXELS = 1' `
            'END_BORDER_PIXELS = 0' `
            'remove longitudinal transparent border'
          Replace-Required $assets `
            'ALPHA_LEVELS = (0.028, 0.045, 0.070, 0.100)' `
            'ALPHA_LEVELS = (0.140, 0.200, 0.280, 0.380)' `
            'daylight optical density buckets'
          Replace-Required $assets `
            'LIT_BRIGHTNESS_NITS = 85' `
            'LIT_BRIGHTNESS_NITS = 2500' `
            'daylight cloud luminance'
          Replace-Required $assets `
            'end_envelope = 1.0 - smoothstep(0.94, 0.995, abs(py))' `
            'end_envelope = 1.0' `
            'continuous longitudinal density'

          $assetText = Get-Content $assets -Raw
          $oldCloud = @'
                      cloud_detail = 0.0
                      for lx, ly, sigma, weight in cloud_lobes:
                          cloud_detail += weight * gaussian((px - lx) ** 2 + (py - ly) ** 2, sigma)
                      cloud_detail = min(cloud_detail / 2.5, 1.0)

                      longitudinal = (
                          0.93
                          + 0.045 * math.sin(py * 7.1 + centre_phase)
                          + 0.025 * math.sin(py * 15.2 + edge_phase)
                      )
          '@
          $newCloud = @'
                      cloud_detail = 0.0
                      for lx, ly, sigma, weight in cloud_lobes:
                          longitudinal_distance = abs(py - ly)
                          wrapped_longitudinal_distance = min(
                              longitudinal_distance, 2.0 - longitudinal_distance
                          )
                          cloud_detail += weight * gaussian(
                              (px - lx) ** 2 + wrapped_longitudinal_distance ** 2,
                              sigma,
                          )
                      cloud_detail = min(cloud_detail / 2.5, 1.0)

                      longitudinal_phase = math.pi * (py + 1.0)
                      longitudinal = (
                          0.93
                          + 0.045 * math.sin(longitudinal_phase * 3.0 + centre_phase)
                          + 0.025 * math.sin(longitudinal_phase * 7.0 + edge_phase)
                      )
          '@
          if (-not $assetText.Contains($newCloud)) {
            if (-not $assetText.Contains($oldCloud)) { throw "periodic cloud-density source block was not found" }
            $assetText = $assetText.Replace($oldCloud, $newCloud)
          }
          $assetText = $assetText.Replace('v4.7', 'v4.8')
          $assetText = $assetText.Replace('85-nit', '2500-nit')
          Set-Content $assets $assetText -Encoding utf8 -NoNewline

      - name: Fetch X-Plane Plugin SDK 4.3.0
        id: xplane_sdk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          $archive = Join-Path $pwd "third_party/XPSDK430.zip"
          $destination = Join-Path $pwd "third_party/xplane-sdk"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              if (Test-Path $archive) { Remove-Item $archive -Force }
              Invoke-WebRequest `
                -Uri "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip" `
                -OutFile $archive `
                -Headers @{ "User-Agent" = "FFAtmo-GitHub-Actions" }
              if ((Get-Item $archive).Length -lt 1000000) { throw "SDK archive is unexpectedly small" }
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (8 * $attempt)
            }
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $header = Get-ChildItem $destination -Recurse -Filter "XPLMPlugin.h" |
            Where-Object { $_.FullName.Replace('\', '/') -like '*/CHeaders/XPLM/XPLMPlugin.h' } |
            Select-Object -First 1
          if (-not $header) { throw "XPLMPlugin.h was not found" }
          $sdkRoot = Split-Path (Split-Path (Split-Path $header.FullName -Parent) -Parent) -Parent
          "path=$sdkRoot" >> $env:GITHUB_OUTPUT

      - name: Configure build
        shell: pwsh
        run: >-
          cmake -S . -B build-contrail-debug -A x64
          -DXPLANE_SDK="${{ steps.xplane_sdk.outputs.path }}"
          -DFFATMO_BUILD_PLUGIN=OFF
          -DFFATMO_BUILD_COMPANION=OFF
          -DFFATMO_BUILD_IMGUI_PANEL=OFF
          -DFFATMO_BUILD_GEOMETRY_DEBUG=OFF
          -DFFATMO_BUILD_RECORDER_DEBUG=OFF
          -DFFATMO_BUILD_CONTRAIL_DEBUG=ON
          -DFFATMO_BUILD_REPLAY_RUNNER=OFF
          -DFFATMO_BUILD_TESTS=ON
          -DFFATMO_GIT_REVISION="${{ github.sha }}"

      - name: Build plugin and deterministic tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          & cmake --build build-contrail-debug --config Release --target FFAtmoContrailDebug ffatmo_core_tests ffatmo_acf_tests ffatmo_replay_tests ffatmo_replay_runner_tests ffatmo_contrail_tests ffatmo_live_contrail_debug_tests ffatmo_contrail_render_planner_tests *> build-logs/build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ctest --test-dir build-contrail-debug -C Release --output-on-failure *> build-logs/tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plugin = "package/FFAtmoContrailDebug/64/win.xpl"
          if (-not (Test-Path $plugin)) { throw "v4.8 win.xpl was not produced" }
          if ((Get-Item $plugin).Length -lt 100000) { throw "v4.8 win.xpl is unexpectedly small" }

      - name: Generate and validate Renderer v4.8 assets
        shell: pwsh
        run: |
          python tools/generate_contrail_assets.py generated-contrail-assets
          $objects = Get-ChildItem generated-contrail-assets -Filter "contrail_core_*.obj"
          $allTextures = Get-ChildItem generated-contrail-assets -Filter "contrail_core_*.png"
          $litTextures = $allTextures | Where-Object { $_.Name -like '*_LIT.png' }
          $albedoTextures = $allTextures | Where-Object { $_.Name -notlike '*_LIT.png' }
          if ($objects.Count -ne 8) { throw "Expected eight v4.8 OBJ assets" }
          if ($albedoTextures.Count -ne 8) { throw "Expected eight RGBA albedo maps" }
          if ($litTextures.Count -ne 8) { throw "Expected eight RGB LIT maps" }
          $assetInfo = Get-Content generated-contrail-assets/ASSET_INFO.txt -Raw
          if ($assetInfo -notmatch 'v4.8') { throw "ASSET_INFO does not identify v4.8" }
          if ($assetInfo -notmatch '2500-nit') { throw "ASSET_INFO does not identify daylight luminance" }
          foreach ($object in $objects) {
            $lines = Get-Content $object.FullName
            if (-not ($lines -match '^ATTR_blend$')) { throw "Missing alpha blend: $($object.Name)" }
            if (-not ($lines -match '^TEXTURE_LIT .*_LIT\.png$')) { throw "Missing RGB LIT map: $($object.Name)" }
            if (-not ($lines -match '^ATTR_light_level 0 1 ffatmo/contrail_debug/illumination 2500$')) { throw "Missing 2500-nit light level: $($object.Name)" }
            if (-not ($lines -match '^POINT_COUNTS 8 0 0 12$')) { throw "Missing front/back faces: $($object.Name)" }
            if ($lines -match '^ATTR_no_cull$') { throw "Unexpected no-cull path: $($object.Name)" }
          }
          @'
          import struct
          from pathlib import Path
          root = Path("generated-contrail-assets")
          for path in root.glob("contrail_core_*.png"):
              data = path.read_bytes()
              _, _, bit_depth, colour_type, _, _, _ = struct.unpack(">IIBBBBB", data[16:29])
              expected = 2 if path.name.endswith("_LIT.png") else 6
              if bit_depth != 8 or colour_type != expected:
                  raise SystemExit(f"{path.name}: expected PNG colour type {expected}, got {colour_type}")
          '@ | python -

      - name: Commit verified v4.8 source changes
        shell: pwsh
        run: |
          if (-not (git status --porcelain -- src/ContrailWorldRenderer.h src/ContrailDebugPlugin.cpp tools/generate_contrail_assets.py)) {
            Write-Host "No v4.8 source changes to commit"
            exit 0
          }
          git config user.name "FreeFlight Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/ContrailWorldRenderer.h src/ContrailDebugPlugin.cpp tools/generate_contrail_assets.py
          git commit -m "Implement Renderer Foundation v4.8 daylight cloud correction"
          git push origin "HEAD:$env:TARGET_BRANCH"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmoContrailDebug-build-diagnostics
          path: build-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Assemble LevelUp B738 Contrail v4.8 package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/64 | Out-Null
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/assets | Out-Null
          Copy-Item package/FFAtmoContrailDebug/64/win.xpl artifact/FFAtmoContrailDebug/64/win.xpl -Force
          Copy-Item generated-contrail-assets/* artifact/FFAtmoContrailDebug/assets/ -Force
          @'
          FFAtmo LevelUp 737-800NG Contrail Vertical Slice v4.8

          PURPOSE
          Replace the dim terrain-coloured rope appearance from v4.7 with a bright,
          continuous daylight ice-cloud trail while preserving the accepted cooling,
          nucleation, LevelUp exhaust geometry and Wake Fluid Simulation v1.

          INSTALL
          1. Close X-Plane.
          2. Delete the previous FFAtmoContrailDebug folder completely.
          3. Copy this FFAtmoContrailDebug folder into X-Plane 12/Resources/plugins/.
          4. Keep Effects Takeover v2.2 installed on the LevelUp B738.

          V4.8 CHANGES
          - optical alpha buckets raised from 2.8-10% to 14-38%
          - controlled RGB-only cloud luminance raised from 85 to 2500 nits
          - longitudinal texture density is periodic and no longer fades at card ends
          - visible capacity raised from 1024 to 1536 sections
          - per-asset instance pools raised from 192 to 256
          - cooling delay, condensation model and wake physics are unchanged

          TEST
          1. Confirm the overlay says WORLD V4.8 READY.
          2. Select Forced Dry Preview.
          3. Fly for 20-30 seconds.
          4. Inspect against both clear sky and terrain.
          5. Repeat once in Forced Persistent Preview.

          PASS TARGET
          - white or light-grey ice-cloud colour against sky and terrain
          - no black, brown, yellow or terrain-coloured rope sections
          - no repeating gaps between cards
          - cooling gap remains behind both CFM56 nozzles
          - two near-field streams remain distinct
          - capacity rejection is eliminated or substantially reduced
          - zero stream breaks and pool drops
          '@ | Set-Content artifact/FFAtmoContrailDebug/README_TESTING.txt -Encoding utf8
          "renderer=engine-v1-levelup-b738-contrail-v4.8-daylight-cloud" | Set-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8
          "git_revision=${{ github.sha }}" | Add-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8

      - name: Upload live contrail visual debug plugin
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmoContrailDebug-win64
          path: artifact/FFAtmoContrailDebug
          if-no-files-found: error
          retention-days: 14
