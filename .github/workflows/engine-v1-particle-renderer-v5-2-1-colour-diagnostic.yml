# FFAtmo v5.2.2 billboard-only live colour-isolation build
name: Package Renderer v5.2.2 Billboard Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - agent/levelup-particle-renderer-v5
    paths:
      - "tools/generate_particle_renderer_v5_2_2_billboard_diagnostic.py"
      - ".github/workflows/engine-v1-particle-renderer-v5-2-1-colour-diagnostic.yml"
  pull_request:
    branches:
      - engine/v1
    paths:
      - "tools/generate_particle_renderer_v5_2_2_billboard_diagnostic.py"
      - ".github/workflows/engine-v1-particle-renderer-v5-2-1-colour-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: ffatmo-renderer-v522-billboard-diagnostic-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/levelup-particle-renderer-v5

      - name: Validate current safe renderer source
        shell: pwsh
        run: |
          $renderer = Get-Content src/ContrailParticleRenderer.h -Raw
          $plugin = Get-Content src/ContrailDebugPlugin.cpp -Raw
          if ($renderer -match 'XPLMLoadObjectAsync\(') { throw "Unsafe loader remains" }
          if ($renderer -notmatch 'deferredNonEmptyFrameCount_ < 3') { throw "Safe-start gate is missing" }
          if ($plugin -notmatch 'WORLD V5\.2 READY') { throw "Expected v5.2 renderer source" }

      - name: Fetch X-Plane SDK
        id: sdk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          $archive = Join-Path $pwd "third_party/XPSDK430.zip"
          $destination = Join-Path $pwd "third_party/xplane-sdk"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              if (Test-Path $archive) { Remove-Item $archive -Force }
              Invoke-WebRequest -Uri "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip" -OutFile $archive -Headers @{ "User-Agent" = "FFAtmo-GitHub-Actions" }
              if ((Get-Item $archive).Length -lt 1000000) { throw "SDK archive too small" }
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (8 * $attempt)
            }
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $header = Get-ChildItem $destination -Recurse -Filter "XPLMPlugin.h" | Where-Object { $_.FullName.Replace('\', '/') -like '*/CHeaders/XPLM/XPLMPlugin.h' } | Select-Object -First 1
          if (-not $header) { throw "XPLMPlugin.h missing" }
          $root = Split-Path (Split-Path (Split-Path $header.FullName -Parent) -Parent) -Parent
          "path=$root" >> $env:GITHUB_OUTPUT

      - name: Configure, build and test
        shell: pwsh
        run: |
          cmake -S . -B build-v522-diag -A x64 -DXPLANE_SDK="${{ steps.sdk.outputs.path }}" -DFFATMO_BUILD_PLUGIN=OFF -DFFATMO_BUILD_COMPANION=OFF -DFFATMO_BUILD_IMGUI_PANEL=OFF -DFFATMO_BUILD_GEOMETRY_DEBUG=OFF -DFFATMO_BUILD_RECORDER_DEBUG=OFF -DFFATMO_BUILD_CONTRAIL_DEBUG=ON -DFFATMO_BUILD_REPLAY_RUNNER=OFF -DFFATMO_BUILD_TESTS=ON -DFFATMO_GIT_REVISION="${{ github.sha }}"
          cmake --build build-v522-diag --config Release --target FFAtmoContrailDebug ffatmo_core_tests ffatmo_acf_tests ffatmo_replay_tests ffatmo_replay_runner_tests ffatmo_contrail_tests ffatmo_live_contrail_debug_tests ffatmo_contrail_render_planner_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-v522-diag -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate and validate billboard-isolation assets
        shell: pwsh
        run: |
          python tools/generate_particle_renderer_v5_2_2_billboard_diagnostic.py generated-diagnostic-assets
          $obj = Get-Content generated-diagnostic-assets/contrail_ribbon.obj -Raw
          $pssLines = Get-Content generated-diagnostic-assets/contrail_v5_2_2_billboard_diag.pss
          if ($obj -match 'TRIS|TEXTURE_LIT') { throw "Legacy geometry found" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'PARTICLE' }).Count -ne 1) { throw "Expected one particle type" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'SUB_EMITTER' }).Count -ne 1) { throw "Expected one sub-emitter" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'BILLBOARD_MODE BILLBOARD' }).Count -ne 1) { throw "Billboard path is missing" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'BILLBOARD_MODE RIBBON' }).Count -ne 0) { throw "Ribbon path must not be present" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'BLEND_MODE NORMAL' }).Count -ne 1) { throw "Expected one normal-blend path" }

      - name: Assemble diagnostic package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/64 | Out-Null
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/assets | Out-Null
          Copy-Item package/FFAtmoContrailDebug/64/win.xpl artifact/FFAtmoContrailDebug/64/win.xpl -Force
          Copy-Item generated-diagnostic-assets/* artifact/FFAtmoContrailDebug/assets/ -Force
          @'
          FFAtmo Renderer v5.2.2 Billboard-Only Colour Diagnostic

          PURPOSE
          Determine whether the black colour is exclusive to X-Plane's live Ribbon
          path. This uses the same safe v5.2 plugin, instance datarefs and pure-white
          texture principles, but contains no ribbon particle at all.

          EXPECTED RESULT
          Two streams of separate white cloud puffs, one behind each CFM56.
          They will not be continuous or final-quality; this is only a colour test.

          INTERPRETATION
          - White/light-grey puffs: Ribbon mode is the failing path. Move the final
            renderer to pooled billboards driven by the wake parcels.
          - Black puffs: the problem affects plugin-instanced particles generally.
            Next compare against a stock Laminar particle asset and instance path.
          - No puffs: the billboard emitter definition is not accepted live; inspect
            the particle browser and Log.txt before changing renderer architecture.

          INSTALL
          Delete the previous FFAtmoContrailDebug folder before installing.
          Use Forced Dry Preview and fly straight for 10-15 seconds.
          '@ | Set-Content artifact/FFAtmoContrailDebug/README_DIAGNOSTIC.txt -Encoding utf8
          "renderer=engine-v1-levelup-b738-v5.2.2-billboard-colour-isolation" | Set-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8

      - name: Upload diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmoContrailDebug-v5.2.2-billboard-diagnostic
          path: artifact/FFAtmoContrailDebug
          if-no-files-found: error
          retention-days: 14
