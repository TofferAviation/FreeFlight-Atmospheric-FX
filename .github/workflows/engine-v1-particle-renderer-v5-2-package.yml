name: Package Renderer v5.2.1 Colour Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - agent/levelup-particle-renderer-v5
    paths:
      - "tools/generate_particle_renderer_v5_2_1_colour_diagnostic.py"
      - ".github/workflows/engine-v1-particle-renderer-v5-2-package.yml"
  pull_request:
    branches:
      - engine/v1
    paths:
      - "tools/generate_particle_renderer_v5_2_1_colour_diagnostic.py"
      - ".github/workflows/engine-v1-particle-renderer-v5-2-package.yml"

permissions:
  contents: read

concurrency:
  group: ffatmo-renderer-v521-colour-diagnostic-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/levelup-particle-renderer-v5

      - name: Validate safe renderer source
        shell: pwsh
        run: |
          $renderer = Get-Content src/ContrailParticleRenderer.h -Raw
          $plugin = Get-Content src/ContrailDebugPlugin.cpp -Raw
          if ($renderer -match 'XPLMLoadObjectAsync\(') { throw "Unsafe loader remains" }
          if ($renderer -notmatch 'deferredNonEmptyFrameCount_ < 3') { throw "Safe-start gate is missing" }
          if ($plugin -notmatch 'WORLD V5\.2 READY') { throw "Expected v5.2 renderer source" }

      - name: Fetch X-Plane SDK
        id: sdk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          $archive = Join-Path $pwd "third_party/XPSDK430.zip"
          $destination = Join-Path $pwd "third_party/xplane-sdk"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              if (Test-Path $archive) { Remove-Item $archive -Force }
              Invoke-WebRequest -Uri "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip" -OutFile $archive -Headers @{ "User-Agent" = "FFAtmo-GitHub-Actions" }
              if ((Get-Item $archive).Length -lt 1000000) { throw "SDK archive too small" }
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (8 * $attempt)
            }
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $header = Get-ChildItem $destination -Recurse -Filter "XPLMPlugin.h" | Where-Object { $_.FullName.Replace('\', '/') -like '*/CHeaders/XPLM/XPLMPlugin.h' } | Select-Object -First 1
          if (-not $header) { throw "XPLMPlugin.h missing" }
          $root = Split-Path (Split-Path (Split-Path $header.FullName -Parent) -Parent) -Parent
          "path=$root" >> $env:GITHUB_OUTPUT

      - name: Configure, build and test
        shell: pwsh
        run: |
          cmake -S . -B build-v521-diag -A x64 -DXPLANE_SDK="${{ steps.sdk.outputs.path }}" -DFFATMO_BUILD_PLUGIN=OFF -DFFATMO_BUILD_COMPANION=OFF -DFFATMO_BUILD_IMGUI_PANEL=OFF -DFFATMO_BUILD_GEOMETRY_DEBUG=OFF -DFFATMO_BUILD_RECORDER_DEBUG=OFF -DFFATMO_BUILD_CONTRAIL_DEBUG=ON -DFFATMO_BUILD_REPLAY_RUNNER=OFF -DFFATMO_BUILD_TESTS=ON -DFFATMO_GIT_REVISION="${{ github.sha }}"
          cmake --build build-v521-diag --config Release --target FFAtmoContrailDebug ffatmo_core_tests ffatmo_acf_tests ffatmo_replay_tests ffatmo_replay_runner_tests ffatmo_contrail_tests ffatmo_live_contrail_debug_tests ffatmo_contrail_render_planner_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-v521-diag -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate and validate colour diagnostic
        shell: pwsh
        run: |
          python tools/generate_particle_renderer_v5_2_1_colour_diagnostic.py generated-diagnostic-assets
          $obj = Get-Content generated-diagnostic-assets/contrail_ribbon.obj -Raw
          $pssLines = Get-Content generated-diagnostic-assets/contrail_v5_2_1_colour_diag.pss
          if ($obj -match 'TRIS|TEXTURE_LIT') { throw "Legacy geometry found" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'PARTICLE' }).Count -ne 3) { throw "Expected three particle types" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'SUB_EMITTER' }).Count -ne 3) { throw "Expected three separate emitters" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'BILLBOARD_MODE RIBBON' }).Count -ne 3) { throw "All paths must remain ribbons" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'BLEND_MODE NORMAL' }).Count -ne 2) { throw "Expected two normal paths" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'BLEND_MODE ADDITIVE' }).Count -ne 1) { throw "Expected one additive path" }

      - name: Assemble diagnostic package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/64 | Out-Null
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/assets | Out-Null
          Copy-Item package/FFAtmoContrailDebug/64/win.xpl artifact/FFAtmoContrailDebug/64/win.xpl -Force
          Copy-Item generated-diagnostic-assets/* artifact/FFAtmoContrailDebug/assets/ -Force
          @'
          FFAtmo Renderer v5.2.1 Colour-Isolation Diagnostic

          TOP RED      = NORMAL blend with AMBIENT=1, DIFFUSE=1, EMISSIVE=0
          MIDDLE GREEN = NORMAL blend with AMBIENT=0, DIFFUSE=0, EMISSIVE=1
          BOTTOM BLUE  = ADDITIVE blend with AMBIENT=0, DIFFUSE=0, EMISSIVE=1

          Red visible: world-lighting path works.
          Green visible: emissive reaches normal blending.
          Only blue visible: normal blend/alpha path causes the black ribbons.
          All black: ribbon colour sampling or an external override is responsible.
          No trails: multiple named emitters are unsupported in this path.

          Delete the previous FFAtmoContrailDebug folder, install this package,
          select Forced Dry Preview, fly straight for 15 seconds, and capture one
          screenshot against sky and one against terrain.
          '@ | Set-Content artifact/FFAtmoContrailDebug/README_DIAGNOSTIC.txt -Encoding utf8
          "renderer=engine-v1-levelup-b738-v5.2.1-colour-isolation" | Set-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8

      - name: Upload diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmoContrailDebug-v5.2.1-colour-diagnostic
          path: artifact/FFAtmoContrailDebug
          if-no-files-found: error
          retention-days: 14
