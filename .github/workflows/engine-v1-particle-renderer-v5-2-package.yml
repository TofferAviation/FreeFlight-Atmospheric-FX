name: Package Renderer Foundation v5.2

on:
  workflow_dispatch:
  push:
    branches:
      - agent/levelup-particle-renderer-v5
    paths:
      - "tools/apply_renderer_v5_2_source_patch.py"
      - "tools/generate_particle_renderer_v5_2_assets.py"
      - ".github/workflows/engine-v1-particle-renderer-v5-2-package.yml"
  pull_request:
    branches:
      - engine/v1
    paths:
      - "tools/apply_renderer_v5_2_source_patch.py"
      - "tools/generate_particle_renderer_v5_2_assets.py"
      - ".github/workflows/engine-v1-particle-renderer-v5-2-package.yml"

permissions:
  contents: read

concurrency:
  group: ffatmo-renderer-v52-package-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/levelup-particle-renderer-v5

      - name: Apply v5.2 source patch
        shell: pwsh
        run: python tools/apply_renderer_v5_2_source_patch.py

      - name: Validate safe source policy
        shell: pwsh
        run: |
          $renderer = Get-Content src/ContrailParticleRenderer.h -Raw
          $plugin = Get-Content src/ContrailDebugPlugin.cpp -Raw
          if ($renderer -match 'XPLMLoadObjectAsync\(') { throw "Unsafe loader remains" }
          if ($renderer -notmatch 'deferredNonEmptyFrameCount_ < 3') { throw "Safe-start gate is missing" }
          if ($renderer -notmatch '0\.68f \+ sample\.widthM / 9\.0f') { throw "v5.2 width shaping is missing" }
          if ($plugin -notmatch 'WORLD V5\.2 READY') { throw "v5.2 overlay label is missing" }

      - name: Fetch X-Plane SDK
        id: sdk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          $archive = Join-Path $pwd "third_party/XPSDK430.zip"
          $destination = Join-Path $pwd "third_party/xplane-sdk"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              if (Test-Path $archive) { Remove-Item $archive -Force }
              Invoke-WebRequest -Uri "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip" -OutFile $archive -Headers @{ "User-Agent" = "FFAtmo-GitHub-Actions" }
              if ((Get-Item $archive).Length -lt 1000000) { throw "SDK archive too small" }
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (8 * $attempt)
            }
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $header = Get-ChildItem $destination -Recurse -Filter "XPLMPlugin.h" | Where-Object { $_.FullName.Replace('\', '/') -like '*/CHeaders/XPLM/XPLMPlugin.h' } | Select-Object -First 1
          if (-not $header) { throw "XPLMPlugin.h missing" }
          $root = Split-Path (Split-Path (Split-Path $header.FullName -Parent) -Parent) -Parent
          "path=$root" >> $env:GITHUB_OUTPUT

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build-v52 -A x64 -DXPLANE_SDK="${{ steps.sdk.outputs.path }}" -DFFATMO_BUILD_PLUGIN=OFF -DFFATMO_BUILD_COMPANION=OFF -DFFATMO_BUILD_IMGUI_PANEL=OFF -DFFATMO_BUILD_GEOMETRY_DEBUG=OFF -DFFATMO_BUILD_RECORDER_DEBUG=OFF -DFFATMO_BUILD_CONTRAIL_DEBUG=ON -DFFATMO_BUILD_REPLAY_RUNNER=OFF -DFFATMO_BUILD_TESTS=ON -DFFATMO_GIT_REVISION="${{ github.sha }}"
          cmake --build build-v52 --config Release --target FFAtmoContrailDebug ffatmo_core_tests ffatmo_acf_tests ffatmo_replay_tests ffatmo_replay_runner_tests ffatmo_contrail_tests ffatmo_live_contrail_debug_tests ffatmo_contrail_render_planner_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-v52 -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate and validate particle assets
        shell: pwsh
        run: |
          python tools/generate_particle_renderer_v5_2_assets.py generated-particle-assets
          $obj = Get-Content generated-particle-assets/contrail_ribbon.obj -Raw
          $pssLines = Get-Content generated-particle-assets/contrail_v5_2.pss
          if ($obj -match 'TRIS|TEXTURE_LIT') { throw "Legacy geometry found" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'SUB_EMITTER' }).Count -ne 1) { throw "Expected one sub-emitter" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'BILLBOARD_MODE RIBBON' }).Count -ne 1) { throw "Ribbon mode missing" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'BILLBOARD_MODE BILLBOARD' }).Count -ne 0) { throw "Failed billboard path returned" }

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/64 | Out-Null
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/assets | Out-Null
          Copy-Item package/FFAtmoContrailDebug/64/win.xpl artifact/FFAtmoContrailDebug/64/win.xpl -Force
          Copy-Item generated-particle-assets/* artifact/FFAtmoContrailDebug/assets/ -Force
          @'
          FFAtmo LevelUp 737-800NG Renderer Foundation v5.2 Realism Pass

          Delete the previous FFAtmoContrailDebug folder before installing.
          Confirm WORLD V5.2 READY and use Forced Dry Preview.

          Expected changes:
          - stable single native ribbon per engine
          - white/light-grey self-lit ice-cloud appearance
          - broader feathered trail body
          - smoother formation and fading
          - unchanged cooling gap, LevelUp geometry and Wake Fluid Simulation v1
          '@ | Set-Content artifact/FFAtmoContrailDebug/README_TESTING.txt -Encoding utf8
          "renderer=engine-v1-levelup-b738-v5.2-single-ribbon-realism" | Set-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8

      - name: Upload v5.2 package
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmoContrailDebug-v5.2-win64
          path: artifact/FFAtmoContrailDebug
          if-no-files-found: error
          retention-days: 14
