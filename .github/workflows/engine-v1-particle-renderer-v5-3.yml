name: Build Renderer Foundation v5.3 Pooled Billboards

on:
  workflow_dispatch:
  push:
    branches:
      - agent/levelup-particle-renderer-v5
    paths:
      - "src/ContrailParticleRenderer.h"
      - "src/ContrailDebugPlugin.cpp"
      - "tools/generate_particle_renderer_v5_3_assets.py"
      - ".github/workflows/engine-v1-particle-renderer-v5-3.yml"
  pull_request:
    branches:
      - engine/v1
    paths:
      - "src/ContrailParticleRenderer.h"
      - "src/ContrailDebugPlugin.cpp"
      - "tools/generate_particle_renderer_v5_3_assets.py"
      - ".github/workflows/engine-v1-particle-renderer-v5-3.yml"

permissions:
  contents: read

concurrency:
  group: ffatmo-renderer-v53-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out billboard renderer branch
        uses: actions/checkout@v4
        with:
          ref: agent/levelup-particle-renderer-v5

      - name: Apply v5.3 runtime labels
        shell: pwsh
        run: |
          $path = "src/ContrailDebugPlugin.cpp"
          $text = Get-Content $path -Raw
          $text = $text.Replace("v5.2", "v5.3")
          $text = $text.Replace("V5.2", "V5.3")
          Set-Content $path $text -Encoding utf8 -NoNewline

          $renderer = Get-Content src/ContrailParticleRenderer.h -Raw
          if ($renderer -match 'XPLMLoadObjectAsync\(') { throw "Unsafe async loader returned" }
          if ($renderer -notmatch 'deferredNonEmptyFrameCount_ < 3') { throw "Safe-start gate is missing" }
          if ($renderer -notmatch 'kInstancesPerAsset = 768') { throw "v5.3 billboard pool size is missing" }
          if ($renderer -notmatch 'contrail_billboard\.obj') { throw "v5.3 billboard object path is missing" }
          if ($renderer -match 'youngest\s*\{\}') { throw "Legacy two-emitter ribbon selection remains" }
          if ($text -notmatch 'WORLD V5\.3 READY') { throw "v5.3 overlay label is missing" }

      - name: Fetch X-Plane Plugin SDK 4.3.0
        id: sdk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          $archive = Join-Path $pwd "third_party/XPSDK430.zip"
          $destination = Join-Path $pwd "third_party/xplane-sdk"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              if (Test-Path $archive) { Remove-Item $archive -Force }
              Invoke-WebRequest -Uri "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip" -OutFile $archive -Headers @{ "User-Agent" = "FFAtmo-GitHub-Actions" }
              if ((Get-Item $archive).Length -lt 1000000) { throw "SDK archive is unexpectedly small" }
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (8 * $attempt)
            }
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $header = Get-ChildItem $destination -Recurse -Filter "XPLMPlugin.h" | Where-Object { $_.FullName.Replace('\', '/') -like '*/CHeaders/XPLM/XPLMPlugin.h' } | Select-Object -First 1
          if (-not $header) { throw "XPLMPlugin.h was not found" }
          $root = Split-Path (Split-Path (Split-Path $header.FullName -Parent) -Parent) -Parent
          "path=$root" >> $env:GITHUB_OUTPUT

      - name: Configure, compile and run deterministic tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          cmake -S . -B build-v53 -A x64 -DXPLANE_SDK="${{ steps.sdk.outputs.path }}" -DFFATMO_BUILD_PLUGIN=OFF -DFFATMO_BUILD_COMPANION=OFF -DFFATMO_BUILD_IMGUI_PANEL=OFF -DFFATMO_BUILD_GEOMETRY_DEBUG=OFF -DFFATMO_BUILD_RECORDER_DEBUG=OFF -DFFATMO_BUILD_CONTRAIL_DEBUG=ON -DFFATMO_BUILD_REPLAY_RUNNER=OFF -DFFATMO_BUILD_TESTS=ON -DFFATMO_GIT_REVISION="${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake --build build-v53 --config Release --target FFAtmoContrailDebug ffatmo_core_tests ffatmo_acf_tests ffatmo_replay_tests ffatmo_replay_runner_tests ffatmo_contrail_tests ffatmo_live_contrail_debug_tests ffatmo_contrail_render_planner_tests *> build-logs/build.txt
          if ($LASTEXITCODE -ne 0) { Get-Content build-logs/build.txt; exit $LASTEXITCODE }
          & ctest --test-dir build-v53 -C Release --output-on-failure *> build-logs/tests.txt
          if ($LASTEXITCODE -ne 0) { Get-Content build-logs/tests.txt; exit $LASTEXITCODE }
          $plugin = "package/FFAtmoContrailDebug/64/win.xpl"
          if (-not (Test-Path $plugin)) { throw "v5.3 win.xpl was not produced" }
          if ((Get-Item $plugin).Length -lt 100000) { throw "v5.3 win.xpl is unexpectedly small" }

      - name: Generate and validate v5.3 billboard assets
        shell: pwsh
        run: |
          python tools/generate_particle_renderer_v5_3_assets.py generated-v53-assets
          $obj = Get-Content generated-v53-assets/contrail_billboard.obj -Raw
          $pssLines = Get-Content generated-v53-assets/contrail_v5_3_billboard.pss
          $info = Get-Content generated-v53-assets/ASSET_INFO.txt -Raw
          if (($pssLines | Where-Object { $_.Trim() -eq 'PARTICLE' }).Count -ne 1) { throw "Expected one particle type" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'SUB_EMITTER' }).Count -ne 1) { throw "Expected one sub-emitter" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'BILLBOARD_MODE BILLBOARD' }).Count -ne 1) { throw "Billboard mode is missing" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'BILLBOARD_MODE RIBBON' }).Count -ne 0) { throw "Ribbon mode returned" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'EMIT_MODE ATTACH' }).Count -ne 1) { throw "Attach mode is missing" }
          if ($obj -match 'TRIS|TEXTURE_LIT') { throw "Legacy card material returned" }
          if ($obj -notmatch 'EMITTER ffatmo_v53_attached_cloud') { throw "Attached billboard emitter is missing" }
          if ($info -notmatch 'positions, width, opacity and rotation') { throw "Asset metadata does not identify parcel control" }
          if ((Get-Item generated-v53-assets/contrail_v5_3_cloud.png).Length -lt 2000) { throw "Cloud texture is unexpectedly small" }

      - name: Assemble LevelUp B738 v5.3 test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/64 | Out-Null
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/assets | Out-Null
          Copy-Item package/FFAtmoContrailDebug/64/win.xpl artifact/FFAtmoContrailDebug/64/win.xpl -Force
          Copy-Item generated-v53-assets/* artifact/FFAtmoContrailDebug/assets/ -Force
          @'
          FFAtmo LevelUp 737-800NG Renderer Foundation v5.3

          PURPOSE
          Replace the black live Ribbon path with pooled white billboard clouds
          positioned directly on Wake Fluid Simulation v1 render samples.

          INSTALL
          1. Close X-Plane completely.
          2. Delete the previous FFAtmoContrailDebug folder.
          3. Copy this FFAtmoContrailDebug folder into X-Plane 12/Resources/plugins/.
          4. Keep Effects Takeover v2.2 installed on the LevelUp B738.

          V5.3 CHANGES
          - no Ribbon particles
          - one attached white cloud billboard per pooled XPLM instance
          - 768-instance pool allocated in 64-instance flight-loop batches
          - near-field-biased deterministic sample selection
          - billboard position, width, opacity and rotation driven by wake samples
          - small deterministic cross-section offsets create visible cloud depth
          - safe-start, cooling/nucleation and LevelUp geometry retained

          TEST
          1. Confirm WORLD V5.3 READY.
          2. Use Forced Dry Preview.
          3. Fly straight for 20 seconds while the pool fills.
          4. Make one gentle 15-25 degree bank.
          5. Inspect from behind, side and front-quarter views.

          PASS TARGET
          - grey/white cloud trail, never black
          - two separate near-field engine streams
          - delayed onset after both CFM56 exhausts
          - visible widening and wake-driven curvature farther aft
          - no simulator crash or long freeze
          - zero stream breaks and no persistent pool-capacity drops

          This is the first parcel-driven billboard foundation, not the final art pass.
          '@ | Set-Content artifact/FFAtmoContrailDebug/README_TESTING.txt -Encoding utf8
          "renderer=engine-v1-levelup-b738-v5.3-pooled-billboards" | Set-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8
          "git_revision=${{ github.sha }}" | Add-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmo-v5.3-build-diagnostics
          path: build-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload v5.3 package
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmoContrailDebug-v5.3-win64
          path: artifact/FFAtmoContrailDebug
          if-no-files-found: error
          retention-days: 14
