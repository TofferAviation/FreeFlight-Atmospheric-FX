name: Build Renderer Foundation v5.4.1 Stable Cloud Field

on:
  workflow_dispatch:
  push:
    branches:
      - agent/levelup-particle-renderer-v5
    paths:
      - "src/ContrailParticleRenderer.h"
      - "src/ContrailDebugPlugin.cpp"
      - "tools/generate_particle_renderer_v5_4_1_assets.py"
      - ".github/workflows/engine-v1-particle-renderer-v5-4-1.yml"
  pull_request:
    branches:
      - engine/v1
    paths:
      - "src/ContrailParticleRenderer.h"
      - "src/ContrailDebugPlugin.cpp"
      - "tools/generate_particle_renderer_v5_4_1_assets.py"
      - ".github/workflows/engine-v1-particle-renderer-v5-4-1.yml"

permissions:
  contents: read

concurrency:
  group: ffatmo-renderer-v541-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out particle renderer branch
        uses: actions/checkout@v4
        with:
          ref: agent/levelup-particle-renderer-v5

      - name: Apply v5.4.1 runtime labels and diagnostics
        shell: pwsh
        run: |
          $path = "src/ContrailDebugPlugin.cpp"
          $text = Get-Content $path -Raw
          $text = $text.Replace("v5.2", "v5.4.1")
          $text = $text.Replace("V5.2", "V5.4.1")
          $text = $text.Replace("v5 point 2", "v5 point 4 point 1")

          $oldCounts = @'
               << "world_renderer_pool_capacity_drop_count="
               << worldRenderer_.poolCapacityDropCount() << '\n'
               << "simulation_enabled="
          '@
          $newCounts = @'
               << "world_renderer_pool_capacity_drop_count="
               << worldRenderer_.poolCapacityDropCount() << '\n'
               << "world_renderer_ownership_reuse_count="
               << worldRenderer_.ownershipReuseCount() << '\n'
               << "world_renderer_ownership_new_binding_count="
               << worldRenderer_.ownershipNewBindingCount() << '\n'
               << "world_renderer_ownership_release_count="
               << worldRenderer_.ownershipReleaseCount() << '\n'
               << "world_renderer_swirl_candidate_count="
               << worldRenderer_.swirlCandidateCount() << '\n'
               << "simulation_enabled="
          '@
          if (-not $text.Contains($oldCounts)) { throw "Renderer ownership report insertion point was not found" }
          $text = $text.Replace($oldCounts, $newCounts)

          $oldMotion = @'
               << "maximum_length_compression_ratio="
               << worldRenderer_.maximumLengthCompressionRatio() << '\n'
               << std::hex << std::setfill('0')
          '@
          $newMotion = @'
               << "maximum_length_compression_ratio="
               << worldRenderer_.maximumLengthCompressionRatio() << '\n'
               << "world_renderer_maximum_wake_turn_deg="
               << worldRenderer_.maximumWakeTurnDeg() << '\n'
               << "world_renderer_maximum_wake_descent_m="
               << worldRenderer_.maximumWakeDescentM() << '\n'
               << std::hex << std::setfill('0')
          '@
          if (-not $text.Contains($oldMotion)) { throw "Swirl diagnostics report insertion point was not found" }
          $text = $text.Replace($oldMotion, $newMotion)
          Set-Content $path $text -Encoding utf8 -NoNewline

          $renderer = Get-Content src/ContrailParticleRenderer.h -Raw
          if ($renderer -match 'XPLMLoadObjectAsync\(') { throw "Unsafe async loader returned" }
          if ($renderer -notmatch 'deferredNonEmptyFrameCount_ < 3') { throw "Safe-start gate is missing" }
          if ($renderer -notmatch 'kInstancesPerAsset = 1024') { throw "Stable 1024-cloud pool is missing" }
          if ($renderer -notmatch 'renderIdToPool_') { throw "Persistent render-ID ownership is missing" }
          if ($renderer -notmatch 'ownershipReuseCount') { throw "Ownership diagnostics are missing" }
          if ($renderer -notmatch 'maximumWakeTurnDeg') { throw "Swirl foundation diagnostics are missing" }
          if ($renderer -notmatch 'Section length is deliberately') { throw "Physical puff-size policy is missing" }
          if ($renderer -match 'continuitySize') { throw "v5.4 oversized continuity puff logic returned" }
          if ($renderer -notmatch '10\.0f\)') { throw "10-metre puff cap is missing" }
          if ($renderer -notmatch '0\.30f\);') { throw "Low-opacity cap is missing" }
          if ($renderer -match 'BILLBOARD_MODE RIBBON') { throw "Ribbon mode returned in renderer source" }
          if ($text -notmatch 'WORLD V5\.4\.1 READY') { throw "v5.4.1 overlay label is missing" }

      - name: Fetch X-Plane Plugin SDK 4.3.0
        id: sdk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          $archive = Join-Path $pwd "third_party/XPSDK430.zip"
          $destination = Join-Path $pwd "third_party/xplane-sdk"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              if (Test-Path $archive) { Remove-Item $archive -Force }
              Invoke-WebRequest -Uri "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip" -OutFile $archive -Headers @{ "User-Agent" = "FFAtmo-GitHub-Actions" }
              if ((Get-Item $archive).Length -lt 1000000) { throw "SDK archive is unexpectedly small" }
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (8 * $attempt)
            }
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $header = Get-ChildItem $destination -Recurse -Filter "XPLMPlugin.h" | Where-Object { $_.FullName.Replace('\', '/') -like '*/CHeaders/XPLM/XPLMPlugin.h' } | Select-Object -First 1
          if (-not $header) { throw "XPLMPlugin.h was not found" }
          $root = Split-Path (Split-Path (Split-Path $header.FullName -Parent) -Parent) -Parent
          "path=$root" >> $env:GITHUB_OUTPUT

      - name: Configure, compile and run deterministic tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          cmake -S . -B build-v541 -A x64 -DXPLANE_SDK="${{ steps.sdk.outputs.path }}" -DFFATMO_BUILD_PLUGIN=OFF -DFFATMO_BUILD_COMPANION=OFF -DFFATMO_BUILD_IMGUI_PANEL=OFF -DFFATMO_BUILD_GEOMETRY_DEBUG=OFF -DFFATMO_BUILD_RECORDER_DEBUG=OFF -DFFATMO_BUILD_CONTRAIL_DEBUG=ON -DFFATMO_BUILD_REPLAY_RUNNER=OFF -DFFATMO_BUILD_TESTS=ON -DFFATMO_GIT_REVISION="${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake --build build-v541 --config Release --target FFAtmoContrailDebug ffatmo_core_tests ffatmo_acf_tests ffatmo_replay_tests ffatmo_replay_runner_tests ffatmo_contrail_tests ffatmo_live_contrail_debug_tests ffatmo_contrail_render_planner_tests *> build-logs/build.txt
          if ($LASTEXITCODE -ne 0) { Get-Content build-logs/build.txt; exit $LASTEXITCODE }
          & ctest --test-dir build-v541 -C Release --output-on-failure *> build-logs/tests.txt
          if ($LASTEXITCODE -ne 0) { Get-Content build-logs/tests.txt; exit $LASTEXITCODE }
          $plugin = "package/FFAtmoContrailDebug/64/win.xpl"
          if (-not (Test-Path $plugin)) { throw "v5.4.1 win.xpl was not produced" }
          if ((Get-Item $plugin).Length -lt 100000) { throw "v5.4.1 win.xpl is unexpectedly small" }

      - name: Generate and validate v5.4.1 stable assets
        shell: pwsh
        run: |
          python tools/generate_particle_renderer_v5_4_1_assets.py generated-v541-assets
          $obj = Get-Content generated-v541-assets/contrail_billboard.obj -Raw
          $pssLines = Get-Content generated-v541-assets/contrail_v5_4_1_billboard.pss
          $info = Get-Content generated-v541-assets/ASSET_INFO.txt -Raw
          if (($pssLines | Where-Object { $_.Trim() -eq 'PARTICLE' }).Count -ne 1) { throw "Expected one particle type" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'SUB_EMITTER' }).Count -ne 1) { throw "Expected one sub-emitter" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'BILLBOARD_MODE BILLBOARD' }).Count -ne 1) { throw "Billboard mode is missing" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'BILLBOARD_MODE RIBBON' }).Count -ne 0) { throw "Ribbon mode returned" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'EMIT_MODE ATTACH' }).Count -ne 1) { throw "Attach mode is missing" }
          if ($obj -match 'TRIS|TEXTURE_LIT') { throw "Legacy card material returned" }
          if ($obj -notmatch 'EMITTER ffatmo_v541_attached_cloud') { throw "Stable attached billboard emitter is missing" }
          if ($info -notmatch 'low-opacity ATTACH billboard') { throw "Stable cloud metadata is missing" }
          if ((Get-Item generated-v541-assets/contrail_v5_4_1_cloud.png).Length -lt 5000) { throw "Cloud texture is unexpectedly small" }
          @'
          import struct
          from pathlib import Path
          path = Path("generated-v541-assets/contrail_v5_4_1_cloud.png")
          data = path.read_bytes()
          width, height, bit_depth, colour_type, _, _, _ = struct.unpack(">IIBBBBB", data[16:29])
          if (width, height, bit_depth, colour_type) != (512, 512, 8, 6):
              raise SystemExit(f"Unexpected PNG format: {(width, height, bit_depth, colour_type)}")
          '@ | python -

      - name: Assemble LevelUp B738 v5.4.1 test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/64 | Out-Null
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/assets | Out-Null
          Copy-Item package/FFAtmoContrailDebug/64/win.xpl artifact/FFAtmoContrailDebug/64/win.xpl -Force
          Copy-Item generated-v541-assets/* artifact/FFAtmoContrailDebug/assets/ -Force
          @'
          FFAtmo LevelUp 737-800NG Renderer Foundation v5.4.1 Stable Cloud Field

          PURPOSE
          Recover from the rejected v5.4 cotton-blob result before visually
          activating stronger vortex swirl.

          V5.4.1 CHANGES
          - persistent render-ID to XPLM-instance ownership prevents puff jumping
          - puff size follows physical wake width only, never planner section length
          - individual clouds are capped at 10 metres
          - substantially lower particle alpha and lower-alpha cloud texture
          - reduced axial and cross-section random displacement
          - near-field twin streams receive the smallest offsets
          - passive diagnostics record wake turn, descent and swirl-ready samples
          - no extra visual swirl force is applied in this build
          - safe-start, condensation timing, LevelUp geometry and Wake Fluid v1 retained

          INSTALL
          1. Close X-Plane completely.
          2. Delete the previous FFAtmoContrailDebug folder.
          3. Copy this FFAtmoContrailDebug folder into X-Plane 12/Resources/plugins/.
          4. Keep Effects Takeover v2.2 installed on the LevelUp B738.

          TEST
          1. Confirm WORLD V5.4.1 READY.
          2. Use Forced Dry Preview.
          3. Fly straight for 25 seconds.
          4. Make one smooth 10-15 degree bank only.
          5. Inspect the near field and older wake from rear-quarter and side views.

          PASS TARGET
          - no large opaque cotton blobs or closed roller-coaster loops
          - clouds remain temporally stable instead of jumping frame to frame
          - two separate near-field engine streams
          - soft grey-white low-density trail
          - cooling gap remains intact
          - zero pool creation drops and no simulator crash
          - report contains ownership reuse and passive swirl diagnostics
          '@ | Set-Content artifact/FFAtmoContrailDebug/README_TESTING.txt -Encoding utf8
          "renderer=engine-v1-levelup-b738-v5.4.1-stable-cloud-field" | Set-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8
          "git_revision=${{ github.sha }}" | Add-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmo-v5.4.1-build-diagnostics
          path: build-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload v5.4.1 package
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmoContrailDebug-v5.4.1-win64
          path: artifact/FFAtmoContrailDebug
          if-no-files-found: error
          retention-days: 14
