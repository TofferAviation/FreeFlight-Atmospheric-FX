name: Build Renderer Foundation v5.4 Ultra Realism

on:
  workflow_dispatch:
  push:
    branches:
      - agent/levelup-particle-renderer-v5
    paths:
      - "src/ContrailParticleRenderer.h"
      - "src/ContrailDebugPlugin.cpp"
      - "tools/generate_particle_renderer_v5_4_assets.py"
      - ".github/workflows/engine-v1-particle-renderer-v5-4.yml"
  pull_request:
    branches:
      - engine/v1
    paths:
      - "src/ContrailParticleRenderer.h"
      - "src/ContrailDebugPlugin.cpp"
      - "tools/generate_particle_renderer_v5_4_assets.py"
      - ".github/workflows/engine-v1-particle-renderer-v5-4.yml"

permissions:
  contents: read

concurrency:
  group: ffatmo-renderer-v54-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out billboard renderer branch
        uses: actions/checkout@v4
        with:
          ref: agent/levelup-particle-renderer-v5

      - name: Apply v5.4 runtime labels and validate source policy
        shell: pwsh
        run: |
          $path = "src/ContrailDebugPlugin.cpp"
          $text = Get-Content $path -Raw
          $text = $text.Replace("v5.2", "v5.4")
          $text = $text.Replace("V5.2", "V5.4")
          Set-Content $path $text -Encoding utf8 -NoNewline

          $renderer = Get-Content src/ContrailParticleRenderer.h -Raw
          if ($renderer -match 'XPLMLoadObjectAsync\(') { throw "Unsafe async loader returned" }
          if ($renderer -notmatch 'deferredNonEmptyFrameCount_ < 3') { throw "Safe-start gate is missing" }
          if ($renderer -notmatch 'kInstancesPerAsset = 1024') { throw "v5.4 1024-cloud pool is missing" }
          if ($renderer -notmatch 'sample\.lengthM \*') { throw "Length-driven cloud overlap is missing" }
          if ($renderer -notmatch 'usedThisFrame_') { throw "Safe per-frame pool bookkeeping is missing" }
          if ($renderer -notmatch 'contrail_billboard\.obj') { throw "v5.4 billboard object path is missing" }
          if ($renderer -match 'BILLBOARD_MODE RIBBON') { throw "Ribbon mode returned in renderer source" }
          if ($text -notmatch 'WORLD V5\.4 READY') { throw "v5.4 overlay label is missing" }

      - name: Fetch X-Plane Plugin SDK 4.3.0
        id: sdk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          $archive = Join-Path $pwd "third_party/XPSDK430.zip"
          $destination = Join-Path $pwd "third_party/xplane-sdk"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              if (Test-Path $archive) { Remove-Item $archive -Force }
              Invoke-WebRequest -Uri "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip" -OutFile $archive -Headers @{ "User-Agent" = "FFAtmo-GitHub-Actions" }
              if ((Get-Item $archive).Length -lt 1000000) { throw "SDK archive is unexpectedly small" }
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (8 * $attempt)
            }
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $header = Get-ChildItem $destination -Recurse -Filter "XPLMPlugin.h" | Where-Object { $_.FullName.Replace('\', '/') -like '*/CHeaders/XPLM/XPLMPlugin.h' } | Select-Object -First 1
          if (-not $header) { throw "XPLMPlugin.h was not found" }
          $root = Split-Path (Split-Path (Split-Path $header.FullName -Parent) -Parent) -Parent
          "path=$root" >> $env:GITHUB_OUTPUT

      - name: Configure, compile and run deterministic tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          cmake -S . -B build-v54 -A x64 -DXPLANE_SDK="${{ steps.sdk.outputs.path }}" -DFFATMO_BUILD_PLUGIN=OFF -DFFATMO_BUILD_COMPANION=OFF -DFFATMO_BUILD_IMGUI_PANEL=OFF -DFFATMO_BUILD_GEOMETRY_DEBUG=OFF -DFFATMO_BUILD_RECORDER_DEBUG=OFF -DFFATMO_BUILD_CONTRAIL_DEBUG=ON -DFFATMO_BUILD_REPLAY_RUNNER=OFF -DFFATMO_BUILD_TESTS=ON -DFFATMO_GIT_REVISION="${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake --build build-v54 --config Release --target FFAtmoContrailDebug ffatmo_core_tests ffatmo_acf_tests ffatmo_replay_tests ffatmo_replay_runner_tests ffatmo_contrail_tests ffatmo_live_contrail_debug_tests ffatmo_contrail_render_planner_tests *> build-logs/build.txt
          if ($LASTEXITCODE -ne 0) { Get-Content build-logs/build.txt; exit $LASTEXITCODE }
          & ctest --test-dir build-v54 -C Release --output-on-failure *> build-logs/tests.txt
          if ($LASTEXITCODE -ne 0) { Get-Content build-logs/tests.txt; exit $LASTEXITCODE }
          $plugin = "package/FFAtmoContrailDebug/64/win.xpl"
          if (-not (Test-Path $plugin)) { throw "v5.4 win.xpl was not produced" }
          if ((Get-Item $plugin).Length -lt 100000) { throw "v5.4 win.xpl is unexpectedly small" }

      - name: Generate and validate v5.4 ultra-real assets
        shell: pwsh
        run: |
          python tools/generate_particle_renderer_v5_4_assets.py generated-v54-assets
          $obj = Get-Content generated-v54-assets/contrail_billboard.obj -Raw
          $pssLines = Get-Content generated-v54-assets/contrail_v5_4_billboard.pss
          $info = Get-Content generated-v54-assets/ASSET_INFO.txt -Raw
          if (($pssLines | Where-Object { $_.Trim() -eq 'PARTICLE' }).Count -ne 1) { throw "Expected one particle type" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'SUB_EMITTER' }).Count -ne 1) { throw "Expected one sub-emitter" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'BILLBOARD_MODE BILLBOARD' }).Count -ne 1) { throw "Billboard mode is missing" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'BILLBOARD_MODE RIBBON' }).Count -ne 0) { throw "Ribbon mode returned" }
          if (($pssLines | Where-Object { $_.Trim() -eq 'EMIT_MODE ATTACH' }).Count -ne 1) { throw "Attach mode is missing" }
          if ($obj -match 'TRIS|TEXTURE_LIT') { throw "Legacy card material returned" }
          if ($obj -notmatch 'EMITTER ffatmo_v54_attached_cloud') { throw "Attached billboard emitter is missing" }
          if ($info -notmatch '512x512') { throw "High-resolution cloud metadata is missing" }
          if ($info -notmatch 'Multi-scale cloud lobes') { throw "Ultra-real cloud structure metadata is missing" }
          if ((Get-Item generated-v54-assets/contrail_v5_4_cloud.png).Length -lt 5000) { throw "Cloud texture is unexpectedly small" }
          @'
          import struct
          from pathlib import Path
          path = Path("generated-v54-assets/contrail_v5_4_cloud.png")
          data = path.read_bytes()
          width, height, bit_depth, colour_type, _, _, _ = struct.unpack(">IIBBBBB", data[16:29])
          if (width, height, bit_depth, colour_type) != (512, 512, 8, 6):
              raise SystemExit(f"Unexpected PNG format: {(width, height, bit_depth, colour_type)}")
          '@ | python -

      - name: Assemble LevelUp B738 v5.4 test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/64 | Out-Null
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/assets | Out-Null
          Copy-Item package/FFAtmoContrailDebug/64/win.xpl artifact/FFAtmoContrailDebug/64/win.xpl -Force
          Copy-Item generated-v54-assets/* artifact/FFAtmoContrailDebug/assets/ -Force
          @'
          FFAtmo LevelUp 737-800NG Renderer Foundation v5.4 Ultra Realism

          PURPOSE
          Turn the accepted v5.3 parcel-driven billboard wake into a fuller,
          continuous and less repetitive ice-cloud volume without replacing the
          stable renderer architecture.

          INSTALL
          1. Close X-Plane completely.
          2. Delete the previous FFAtmoContrailDebug folder.
          3. Copy this FFAtmoContrailDebug folder into X-Plane 12/Resources/plugins/.
          4. Keep Effects Takeover v2.2 installed on the LevelUp B738.

          V5.4 CHANGES
          - pooled cloud capacity raised from 768 to 1024
          - pool creation spread across 48-instance flight-loop batches
          - billboard size now covers both wake width and section length
          - deterministic axial and cross-section scatter creates cloud volume
          - far-wake selection retains more roll-up and descent detail
          - opacity and size vary deterministically to break mechanical repetition
          - new 512x512 multi-scale ice-cloud texture with feathered voids
          - no Ribbon particles, cards, custom OpenGL or startup async loading

          TEST
          1. Confirm WORLD V5.4 READY.
          2. Use Forced Dry Preview.
          3. Fly straight for 25 seconds while the 1024-cloud pool fills.
          4. Make one smooth 15-25 degree bank.
          5. Inspect the near field, side profile and far-wake loops.

          PASS TARGET
          - grey/white continuous cloud body rather than a thin outline
          - no obvious evenly spaced dots or repeated circular puffs
          - two distinct streams near both CFM56 engines
          - delayed condensation onset remains around the accepted cooling gap
          - wake roll-up reads as a volumetric swirl rather than a line
          - no startup crash, long freeze or persistent pool creation drops

          This is the first ultra-real density pass; atmospheric breakup and
          long-duration dissipation remain later tuning stages.
          '@ | Set-Content artifact/FFAtmoContrailDebug/README_TESTING.txt -Encoding utf8
          "renderer=engine-v1-levelup-b738-v5.4-ultra-real-billboards" | Set-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8
          "git_revision=${{ github.sha }}" | Add-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmo-v5.4-build-diagnostics
          path: build-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload v5.4 package
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmoContrailDebug-v5.4-win64
          path: artifact/FFAtmoContrailDebug
          if-no-files-found: error
          retention-days: 14
