name: Build Renderer Foundation v6.9 Simulator Package

on:
  workflow_dispatch:
  push:
    branches:
      - engine/v6.9-lagrangian-vortex-sheet
    paths:
      - "src/ContrailVortexSheetRenderer.h"
      - "src/engine/WakeVortexSheet.h"
      - "src/render/VortexSheetRenderField.h"
      - "tools/patch_v6_9_vortex_sheet_runtime.py"
      - "tools/patch_v6_9_simulator_renderer.py"
      - "tools/generate_v6_9_ice_volume_assets.py"
      - ".github/workflows/engine-v1-v6-9-simulator.yml"
  pull_request:
    paths:
      - "src/ContrailVortexSheetRenderer.h"
      - "src/engine/WakeVortexSheet.h"
      - "src/render/VortexSheetRenderField.h"
      - "tools/patch_v6_9_vortex_sheet_runtime.py"
      - "tools/patch_v6_9_simulator_renderer.py"
      - "tools/generate_v6_9_ice_volume_assets.py"
      - ".github/workflows/engine-v1-v6-9-simulator.yml"

permissions:
  contents: read

concurrency:
  group: ffatmo-v69-simulator-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out v6.9 branch
        uses: actions/checkout@v4

      - name: Apply accepted renderer baseline through final v6.8 retry
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          $scripts = @(
            "tools/fix_v5_5_regex_literals.py",
            "tools/patch_v5_4_1_runtime.py",
            "tools/patch_v5_5_parcel_clusters.py",
            "tools/patch_v5_5_1_visibility.py",
            "tools/patch_v5_5_2_cruise_visibility.py",
            "tools/patch_v5_6_connected_cloud_swirl.py",
            "tools/patch_v6_1_cloudlet_renderer.py",
            "tools/patch_v6_2_filled_cloud_renderer.py",
            "tools/patch_v6_3_morphology_onset_v2.py",
            "tools/patch_v6_4_head_endpoint_pool.py",
            "tools/fix_v6_5_report_matchers.py",
            "tools/patch_v6_5_handoff_vortex.py",
            "tools/patch_v6_6_smooth_stable_field.py",
            "tools/fix_v6_7_report_matcher.py",
            "tools/patch_v6_7_physics_coupled_rollup.py",
            "tools/fix_v6_8_diagnostic_reset.py",
            "tools/patch_v6_8_visible_primary_rollup.py"
          )
          foreach ($script in $scripts) {
            "RUN $script" | Tee-Object -FilePath build-logs/patch-baseline.txt -Append
            & python $script 2>&1 | Tee-Object -FilePath build-logs/patch-baseline.txt -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Apply v6.9 physical marker runtime and simulator renderer
        shell: pwsh
        run: |
          python tools/patch_v6_9_vortex_sheet_runtime.py 2>&1 | Tee-Object -FilePath build-logs/patch-v69-runtime.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/patch_v6_9_simulator_renderer.py 2>&1 | Tee-Object -FilePath build-logs/patch-v69-renderer.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $plugin = Get-Content src/ContrailDebugPlugin.cpp -Raw
          $renderer = Get-Content src/ContrailVortexSheetRenderer.h -Raw
          if ($plugin -notmatch 'ContrailVortexSheetRenderer') { throw "v6.9 renderer is not wired into plugin" }
          if ($plugin -notmatch 'buildVortexSheetRenderField\(liveEngine_\.parcels\(\)\)') { throw "actual marker field is not submitted" }
          if ($plugin -match 'worldRenderer_\.update\(latestRenderPlan_\.samples\)') { throw "legacy centreline renderer survived" }
          if ($renderer -notmatch 'kVisibleCapacity = kAssetCount \* kInstancesPerAsset') { throw "1024 lane budget contract missing" }
          if ($renderer -notmatch 'selectLaneCoherently') { throw "lane-coherent selector missing" }
          if ($renderer -notmatch 'worldTangent') { throw "deformed tangent input missing" }
          if ($renderer -match 'trailTangentLocal') { throw "legacy straight tangent returned in v6.9 renderer" }

      - name: Generate and validate v6.9 elongated ice volumes
        shell: pwsh
        run: |
          python tools/generate_v6_9_ice_volume_assets.py generated-v69-assets 2>&1 | Tee-Object -FilePath build-logs/assets.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          root = Path("generated-v69-assets")
          expected = ["inner", "core", "outer", "secondary"]
          for lane in expected:
              obj = root / f"contrail_v69_{lane}.obj"
              png = root / f"contrail_v69_{lane}.png"
              if not obj.exists() or not png.exists():
                  raise RuntimeError(f"missing v6.9 {lane} asset")
              text = obj.read_text()
              if "GLOBAL_no_blend 0.500" not in text:
                  raise RuntimeError(f"{lane}: alpha-test state missing")
              if any(token in text for token in ("ATTR_blend", "ATTR_no_cull", "BILLBOARD", "PARTICLE_SYSTEM", "TEXTURE_LIT")):
                  raise RuntimeError(f"{lane}: forbidden translucent/unsupported state")
              zs = [float(line.split()[3]) for line in text.splitlines() if line.startswith("VT ")]
              if max(zs) - min(zs) < 50.0:
                  raise RuntimeError(f"{lane}: ice volume is not elongated enough")
          '@ | python -

      - name: Fetch X-Plane Plugin SDK 4.3.0
        id: sdk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          $archive = Join-Path $pwd "third_party/XPSDK430.zip"
          $destination = Join-Path $pwd "third_party/xplane-sdk"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              if (Test-Path $archive) { Remove-Item $archive -Force }
              Invoke-WebRequest -Uri "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip" -OutFile $archive -Headers @{ "User-Agent" = "FFAtmo-GitHub-Actions" }
              if ((Get-Item $archive).Length -lt 1000000) { throw "SDK archive is unexpectedly small" }
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (8 * $attempt)
            }
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $header = Get-ChildItem $destination -Recurse -Filter "XPLMPlugin.h" | Where-Object { $_.FullName.Replace('\', '/') -like '*/CHeaders/XPLM/XPLMPlugin.h' } | Select-Object -First 1
          if (-not $header) { throw "XPLMPlugin.h was not found" }
          $root = Split-Path (Split-Path (Split-Path $header.FullName -Parent) -Parent) -Parent
          "path=$root" >> $env:GITHUB_OUTPUT

      - name: Compile first v6.9 simulator plugin and deterministic tests
        shell: pwsh
        run: |
          cmake -S . -B build-v69-sim -A x64 -DXPLANE_SDK="${{ steps.sdk.outputs.path }}" -DFFATMO_BUILD_PLUGIN=OFF -DFFATMO_BUILD_COMPANION=OFF -DFFATMO_BUILD_IMGUI_PANEL=OFF -DFFATMO_BUILD_GEOMETRY_DEBUG=OFF -DFFATMO_BUILD_RECORDER_DEBUG=OFF -DFFATMO_BUILD_CONTRAIL_DEBUG=ON -DFFATMO_BUILD_REPLAY_RUNNER=OFF -DFFATMO_BUILD_TESTS=ON -DFFATMO_GIT_REVISION="${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake --build build-v69-sim --config Release --target FFAtmoContrailDebug ffatmo_core_tests ffatmo_acf_tests ffatmo_replay_tests ffatmo_replay_runner_tests ffatmo_contrail_tests ffatmo_live_contrail_debug_tests ffatmo_contrail_render_planner_tests *> build-logs/build.txt
          if ($LASTEXITCODE -ne 0) { Get-Content build-logs/build.txt; exit $LASTEXITCODE }
          & ctest --test-dir build-v69-sim -C Release --output-on-failure *> build-logs/tests.txt
          if ($LASTEXITCODE -ne 0) { Get-Content build-logs/tests.txt; exit $LASTEXITCODE }
          if (-not (Test-Path package/FFAtmoContrailDebug/64/win.xpl)) { throw "v6.9 win.xpl was not produced" }

      - name: Assemble first v6.9 simulator ZIP payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/64 | Out-Null
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/assets | Out-Null
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/reports | Out-Null
          Copy-Item package/FFAtmoContrailDebug/64/win.xpl artifact/FFAtmoContrailDebug/64/win.xpl -Force
          Copy-Item generated-v69-assets/* artifact/FFAtmoContrailDebug/assets/ -Force
          @'
          FFAtmo Renderer Foundation v6.9 - FIRST LAGRANGIAN VORTEX SHEET SIMULATOR BUILD

          This is the first X-Plane test package that no longer renders the v6.8
          centreline primary/fill/decorative-swirl model.

          v6.9 renders four persistent WakeFluidSolver material-marker lanes:
            - inner sheet
            - core sheet
            - outer sheet
            - secondary wake

          The XPLMInstance orientation is derived from neighbouring already-deformed
          marker positions. The fixed 1024 native-instance budget is allocated by
          coherent lane/engine continuity. Four long overlapping pure-white binary-
          alpha ice volumes provide low-occupancy stochastic coverage without the
          previous translucent black-haze path.

          TESTING
          1. Replace the previous FFAtmoContrailDebug test folder with this one.
          2. Launch X-Plane 12 with the LevelUp 737-800NG.
          3. Use the FFAtmo Contrail Visual Debug menu and forced persistent preview
             if weather does not naturally form contrails.
          4. Inspect from rear-quarter, side and top views during cruise.
          5. Export the live debug report after the wake has developed.

          Acceptance target: broad twin counter-rotating sheet roll-up with visible
          inner/core/outer separation and a later secondary wake, not two segmented
          centreline ropes.
          '@ | Set-Content artifact/FFAtmoContrailDebug/README_TESTING.txt -Encoding utf8
          "renderer=engine-v1-levelup-b738-v6.9-lagrangian-vortex-sheet-first-simulator" | Set-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8
          "git_revision=${{ github.sha }}" | Add-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8
          "instance_budget=1024" | Add-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8
          "lanes=inner,core,outer,secondary" | Add-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8

      - name: Upload v6.9 build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmo-v6.9-simulator-build-diagnostics
          path: build-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload first v6.9 simulator package
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmoContrailDebug-v6.9-first-simulator-win64
          path: artifact/FFAtmoContrailDebug
          if-no-files-found: error
          retention-days: 14
