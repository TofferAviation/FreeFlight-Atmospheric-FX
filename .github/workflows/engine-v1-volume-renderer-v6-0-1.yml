name: Build Renderer Foundation v6.0.1 Modern3D Dispatch

on:
  workflow_dispatch:
  push:
    branches:
      - agent/levelup-particle-renderer-v5
    paths:
      - "src/ContrailVolumeRenderer.h"
      - "tools/patch_v6_0_volumetric_renderer.py"
      - "tools/fix_v6_0_windows_gl_loader.py"
      - "tools/patch_v6_0_1_modern3d_dispatch.py"
      - ".github/workflows/engine-v1-volume-renderer-v6-0-1.yml"
  pull_request:
    branches:
      - engine/v1
    paths:
      - "src/ContrailVolumeRenderer.h"
      - "tools/patch_v6_0_volumetric_renderer.py"
      - "tools/fix_v6_0_windows_gl_loader.py"
      - "tools/patch_v6_0_1_modern3d_dispatch.py"
      - ".github/workflows/engine-v1-volume-renderer-v6-0-1.yml"

permissions:
  contents: read

concurrency:
  group: ffatmo-volume-v601-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out renderer branch
        uses: actions/checkout@v4
        with:
          ref: agent/levelup-particle-renderer-v5

      - name: Apply stable wake baseline and v6.0.1 dispatch fix
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          $ErrorActionPreference = 'Stop'
          try {
            & python tools/fix_v5_5_regex_literals.py 2>&1 | Tee-Object -FilePath build-logs/patch.txt -Append
            if ($LASTEXITCODE -ne 0) { throw "fix_v5_5_regex_literals.py failed" }
            & python tools/patch_v5_4_1_runtime.py 2>&1 | Tee-Object -FilePath build-logs/patch.txt -Append
            if ($LASTEXITCODE -ne 0) { throw "patch_v5_4_1_runtime.py failed" }
            & python tools/patch_v5_5_parcel_clusters.py 2>&1 | Tee-Object -FilePath build-logs/patch.txt -Append
            if ($LASTEXITCODE -ne 0) { throw "patch_v5_5_parcel_clusters.py failed" }
            & python tools/patch_v5_5_1_visibility.py 2>&1 | Tee-Object -FilePath build-logs/patch.txt -Append
            if ($LASTEXITCODE -ne 0) { throw "patch_v5_5_1_visibility.py failed" }
            & python tools/patch_v5_5_2_cruise_visibility.py 2>&1 | Tee-Object -FilePath build-logs/patch.txt -Append
            if ($LASTEXITCODE -ne 0) { throw "patch_v5_5_2_cruise_visibility.py failed" }
            & python tools/patch_v5_6_connected_cloud_swirl.py 2>&1 | Tee-Object -FilePath build-logs/patch.txt -Append
            if ($LASTEXITCODE -ne 0) { throw "patch_v5_6_connected_cloud_swirl.py failed" }
            & python tools/patch_v6_0_volumetric_renderer.py 2>&1 | Tee-Object -FilePath build-logs/patch.txt -Append
            if ($LASTEXITCODE -ne 0) { throw "patch_v6_0_volumetric_renderer.py failed" }
            & python tools/fix_v6_0_windows_gl_loader.py 2>&1 | Tee-Object -FilePath build-logs/patch.txt -Append
            if ($LASTEXITCODE -ne 0) { throw "fix_v6_0_windows_gl_loader.py failed" }
            & python tools/patch_v6_0_1_modern3d_dispatch.py 2>&1 | Tee-Object -FilePath build-logs/patch.txt -Append
            if ($LASTEXITCODE -ne 0) { throw "patch_v6_0_1_modern3d_dispatch.py failed" }

            $plugin = Get-Content src/ContrailDebugPlugin.cpp -Raw
            $volume = Get-Content src/ContrailVolumeRenderer.h -Raw
            if ($plugin -notmatch 'ContrailVolumeRenderer') { throw "v6.0.1 volume renderer not integrated" }
            if ($plugin -match 'ContrailParticleRenderer worldRenderer_') { throw "Particle renderer still owns world rendering" }
            if ($plugin -notmatch 'VOLUME V6\.0\.1 WAITING DRAW') { throw "v6.0.1 draw-state overlay missing" }
            if ($plugin -notmatch 'world_renderer_draw_callback_count') { throw "v6.0.1 report callback diagnostics missing" }
            if ($volume -notmatch 'xplm_Phase_Modern3D, 1, this') { throw "Modern3D BEFORE callback missing" }
            if ($volume -match 'xplm_Phase_Modern3D, 0, this') { throw "Modern3D AFTER callback returned" }
            if ($volume -notmatch 'drawCallbackInvocationCount_') { throw "callback counter missing" }
            if ($volume -notmatch 'lastWorldRenderType_ == 1') { throw "documented auxiliary-pass filter missing" }
            if ($volume -notmatch 'densityAt\(') { throw "procedural volume density function missing" }
            if ($volume -notmatch 'for \(int i = 0; i < 34; \+\+i\)') { throw "ray-march integration loop missing" }
            if ($volume -match 'BILLBOARD_MODE|PARTICLE_SYSTEM|XPLMCreateInstance') { throw "particle/impostor renderer leaked into v6.0.1" }
            if ($volume -match 'glext\.h|PFNGL') { throw "external GL extension dependency returned" }
            "POLICY CHECKS PASSED" | Tee-Object -FilePath build-logs/patch.txt -Append
          } catch {
            "PATCH/POLICY FAILURE: $($_.Exception.Message)" | Tee-Object -FilePath build-logs/patch.txt -Append
            Get-Content build-logs/patch.txt
            throw
          }

      - name: Fetch X-Plane Plugin SDK 4.3.0
        id: sdk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party | Out-Null
          $archive = Join-Path $pwd "third_party/XPSDK430.zip"
          $destination = Join-Path $pwd "third_party/xplane-sdk"
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              if (Test-Path $archive) { Remove-Item $archive -Force }
              Invoke-WebRequest -Uri "https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK430.zip" -OutFile $archive -Headers @{ "User-Agent" = "FFAtmo-GitHub-Actions" }
              if ((Get-Item $archive).Length -lt 1000000) { throw "SDK archive is unexpectedly small" }
              break
            } catch {
              if ($attempt -eq 5) { throw }
              Start-Sleep -Seconds (8 * $attempt)
            }
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $header = Get-ChildItem $destination -Recurse -Filter "XPLMPlugin.h" | Where-Object { $_.FullName.Replace('\', '/') -like '*/CHeaders/XPLM/XPLMPlugin.h' } | Select-Object -First 1
          if (-not $header) { throw "XPLMPlugin.h was not found" }
          $root = Split-Path (Split-Path (Split-Path $header.FullName -Parent) -Parent) -Parent
          "path=$root" >> $env:GITHUB_OUTPUT

      - name: Compile volumetric plugin and deterministic physics tests
        shell: pwsh
        run: |
          cmake -S . -B build-v601 -A x64 -DXPLANE_SDK="${{ steps.sdk.outputs.path }}" -DFFATMO_BUILD_PLUGIN=OFF -DFFATMO_BUILD_COMPANION=OFF -DFFATMO_BUILD_IMGUI_PANEL=OFF -DFFATMO_BUILD_GEOMETRY_DEBUG=OFF -DFFATMO_BUILD_RECORDER_DEBUG=OFF -DFFATMO_BUILD_CONTRAIL_DEBUG=ON -DFFATMO_BUILD_REPLAY_RUNNER=OFF -DFFATMO_BUILD_TESTS=ON -DFFATMO_GIT_REVISION="${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmake --build build-v601 --config Release --target FFAtmoContrailDebug ffatmo_core_tests ffatmo_acf_tests ffatmo_replay_tests ffatmo_replay_runner_tests ffatmo_contrail_tests ffatmo_live_contrail_debug_tests ffatmo_contrail_render_planner_tests *> build-logs/build.txt
          if ($LASTEXITCODE -ne 0) { Get-Content build-logs/build.txt; exit $LASTEXITCODE }
          & ctest --test-dir build-v601 -C Release --output-on-failure *> build-logs/tests.txt
          if ($LASTEXITCODE -ne 0) { Get-Content build-logs/tests.txt; exit $LASTEXITCODE }
          if (-not (Test-Path package/FFAtmoContrailDebug/64/win.xpl)) { throw "v6.0.1 plugin was not produced" }

      - name: Assemble v6.0.1 dispatch test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/FFAtmoContrailDebug/64 | Out-Null
          Copy-Item package/FFAtmoContrailDebug/64/win.xpl artifact/FFAtmoContrailDebug/64/win.xpl -Force
          @'
          FFAtmo Renderer Foundation v6.0.1 - Modern3D Dispatch Fix

          This remains the true procedural 3-D volume ray-march renderer.
          No particle, billboard, axial, ribbon, or OBJ-card fallback is present.

          v6.0.1 changes:
          - Registers xplm_Phase_Modern3D as the BEFORE callback.
          - Removes the silent "render type must equal zero" pre-GPU-init failure mode.
          - Skips only documented auxiliary passes 1/3/6.
          - Adds draw callback, regular pass, GPU init and last-render-type diagnostics.
          - Overlay states: WAITING DRAW -> GPU INIT -> GPU READY.

          Test Forced Dry Preview. Export the report after at least 20 seconds.
          '@ | Set-Content artifact/FFAtmoContrailDebug/README_TESTING.txt -Encoding utf8
          "renderer=engine-v1-levelup-b738-v6.0.1-modern3d-dispatch" | Set-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8
          "git_revision=${{ github.sha }}" | Add-Content artifact/FFAtmoContrailDebug/BUILD_INFO.txt -Encoding utf8

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmo-v6.0.1-build-diagnostics
          path: build-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload v6.0.1 package
        uses: actions/upload-artifact@v4
        with:
          name: FFAtmoContrailDebug-v6.0.1-win64
          path: artifact/FFAtmoContrailDebug
          if-no-files-found: error
          retention-days: 14
